<script>
  // Visible error reporting — no DevTools needed. Any script load failure or
  // uncaught JS error gets written directly onto the page instead of leaving
  // a silent blank screen.
  var diagLog = null;
  function getDiagLog() { return diagLog || (diagLog = document.getElementById("diag-log")); }
  function report(msg) {
    var el = getDiagLog();
    if (el) el.textContent += "\n\n" + msg;
    console.error(msg);
  }
  window.addEventListener("error", function (e) {
    if (e.target && e.target.tagName === "SCRIPT") {
      report("FAILED TO LOAD: " + e.target.src + "\n\nThis usually means either no internet connection, or this specific address is blocked on this network/device. Try a different network (like mobile data instead of wifi, or vice versa), or a different browser.");
    } else {
      report("JAVASCRIPT ERROR: " + (e.message || e) + (e.filename ? ("\nat " + e.filename + ":" + e.lineno) : ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    report("UNHANDLED ERROR: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>

const VALID_ROOM_TYPES = ["Non-AC", "AC", "Deluxe"];
const FESTIVAL_DURATION_MS = 24 * 60 * 60 * 1000; // 24 hours
function isFestivalActive(festival) {
    if (!festival || !festival.active || !festival.startedAt)
        return false;
    return Date.now() - new Date(festival.startedAt).getTime() < FESTIVAL_DURATION_MS;
}
function festivalPrice(basePrice, festival) {
    if (!isFestivalActive(festival))
        return basePrice;
    return Math.round(basePrice * (1 - (festival.percent || 20) / 100));
}
function festivalEndsAt(festival) {
    if (!festival || !festival.startedAt)
        return null;
    return new Date(new Date(festival.startedAt).getTime() + FESTIVAL_DURATION_MS);
}
function subscribeAll(onData, onError) {
    const unsubscribers = Object.keys(SEED).map((key) => {
        const ref = db.collection(COLLECTION).doc(key);
        return ref.onSnapshot(async (snap) => {
            if (snap.exists) {
                let value = snap.data().value;
                // one-time cleanup: drop any leftover demo/legacy rooms from older app versions
                if (key === "rooms" && Array.isArray(value)) {
                    const cleaned = value.filter(r => VALID_ROOM_TYPES.includes(r.type));
                    if (cleaned.length !== value.length) {
                        value = cleaned.length > 0 ? cleaned : SEED.rooms;
                        saveKey("rooms", value);
                    }
                }
                cacheLocally(key, value);
                onData(key, value);
            }
            else {
                // first run for this project — seed this document
                try {
                    await ref.set({ value: SEED[key] });
                    cacheLocally(key, SEED[key]);
                    onData(key, SEED[key]);
                }
                catch (e) {
                    onError && onError(e);
                }
            }
        }, (err) => onError && onError(err));
    });
    return () => unsubscribers.forEach((u) => u());
}
async function saveKey(key, value) {
    cacheLocally(key, value); // always keep a local backup, even if Firestore fails
    try {
        await db.collection(COLLECTION).doc(key).set({ value });
    }
    catch (e) {
        console.error("Firestore save failed — check internet connection. Change is saved locally on this device for now.", e);
    }
}
/* Local fallback cache — lets the app open and work immediately even if Firestore
   can't be reached (e.g. a network blocking Google's servers). Once Firestore does
   connect, the real-time data above takes over automatically. */
const LOCAL_CACHE_PREFIX = "luckyFamilyHotelCache:";
function cacheLocally(key, value) {
    try {
        if (typeof window !== "undefined") window.localStorage.setItem(LOCAL_CACHE_PREFIX + key, JSON.stringify(value));
    }
    catch (e) { /* ignore — local cache is a bonus, not required */ }
}
function loadLocalCache() {
    const out = {};
    for (const key of Object.keys(SEED)) {
        try {
            const raw = typeof window !== "undefined" ? window.localStorage.getItem(LOCAL_CACHE_PREFIX + key) : null;
            out[key] = raw ? JSON.parse(raw) : SEED[key];
        }
        catch (e) {
            out[key] = SEED[key];
        }
    }
    return out;
}

function openPrintWindow(html) {
    try {
        let frame = document.getElementById("__lucky_print_frame__");
        if (!frame) {
            frame = document.createElement("iframe");
            frame.id = "__lucky_print_frame__";
            frame.style.position = "fixed";
            frame.style.right = "0";
            frame.style.bottom = "0";
            frame.style.width = "0";
            frame.style.height = "0";
            frame.style.border = "0";
            document.body.appendChild(frame);
        }
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();
        // give the frame a moment to fully render before triggering print —
        // calling print() immediately can produce a blank/partial printout.
        setTimeout(() => {
            frame.contentWindow.focus();
            frame.contentWindow.print();
        }, 300);
    }
    catch (e) {
        console.error("Print failed", e);
        alert("Couldn't open the print dialog in this preview. Try opening the app in a full browser tab instead of an embedded preview.");
    }
}
